name: SonarCloud Analysis

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - dev

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: SonarCloud Code Quality Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP with PCOV Coverage
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, json, libxml
          coverage: pcov
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Cache Node Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Setup Application Environment
        run: |
          cp .env.example .env
          composer install --prefer-dist --no-interaction --no-progress
          php artisan key:generate
          npm ci
          npm run build
          touch database/database.sqlite
          php artisan migrate --force

      - name: Run PHPStan Security & Static Analysis
        run: vendor/bin/phpstan analyse --error-format=json --no-progress > phpstan-report.json || true

      - name: Run Pest Tests with Coverage & JUnit Reports
        run: vendor/bin/pest --coverage --coverage-clover=coverage.xml --log-junit=test-report.xml

      - name: SonarCloud Code & Security Scan
        uses: sonarsource/sonarqube-scan-action@v5
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload Security & Coverage Artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: sonarcloud-reports
          path: |
            coverage.xml
            test-report.xml
            phpstan-report.json
          retention-days: 7

