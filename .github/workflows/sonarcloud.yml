name: SonarCloud Analysis

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: SonarCloud Code Quality Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP with PCOV Coverage
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, json, libxml
          coverage: pcov
          tools: composer:v2

      - name: Cache Composer Dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Setup Application Environment
        run: |
          cp .env.example .env
          composer install --prefer-dist --no-interaction --no-progress
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force

      - name: Run PHPStan Security & Static Analysis
        run: vendor/bin/phpstan analyse --error-format=json --no-progress > phpstan-report.json || true

      - name: Run Pest Tests with Coverage & JUnit Reports
        run: vendor/bin/pest --coverage --coverage-clover=coverage.xml --log-junit=test-report.xml

      - name: SonarCloud Code & Security Scan
        uses: sonarsource/sonarqube-scan-action@v8
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload Security & Coverage Artifacts
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: sonarcloud-reports
          path: |
            coverage.xml
            test-report.xml
            phpstan-report.json
          retention-days: 7

      - name: Generate SonarCloud & Quality Gate Report Summary
        if: always()
        run: |
          echo "## 📊 SonarCloud Quality & Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f .scannerwork/report-task.txt ]; then
            DASHBOARD_URL=$(grep 'dashboardUrl=' .scannerwork/report-task.txt | cut -d'=' -f2-)
            CE_TASK_ID=$(grep 'ceTaskId=' .scannerwork/report-task.txt | cut -d'=' -f2-)
            echo "### 🚀 SonarCloud Analysis" >> $GITHUB_STEP_SUMMARY
            echo "- **Dashboard URL**: [View Analysis on SonarCloud]($DASHBOARD_URL)" >> $GITHUB_STEP_SUMMARY
            echo "- **Project Key**: \`devops-ceria_blog-devops-ceria\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Task ID**: \`$CE_TASK_ID\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Quality Gate Wait**: \`Enabled (timeout: 300s)\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f phpstan-report.json ]; then
            TOTAL_ERRORS=$(python3 -c "import json; d=json.load(open('phpstan-report.json')); print(d.get('totals', {}).get('file_errors', 0))" 2>/dev/null || echo "0")
            echo "### 🛡️ Static Analysis (PHPStan)" >> $GITHUB_STEP_SUMMARY
            echo "- **Errors Found**: \`$TOTAL_ERRORS\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f coverage.xml ]; then
            echo "### 🧪 Code Coverage & Test Execution" >> $GITHUB_STEP_SUMMARY
            echo "- **Coverage Clover Report**: \`coverage.xml\` (Generated)" >> $GITHUB_STEP_SUMMARY
            echo "- **JUnit Execution Report**: \`test-report.xml\` (Generated)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

